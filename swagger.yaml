      tags: [Eshop]

  /payment-methods:
    get:
      summary: List payment methods
      operationId: listPaymentMethods
      tags: [Eshop]

  /payment-methods/{type}:
    patch:
      summary: Update payment method
      operationId: updatePaymentMethod
      tags: [Eshop]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [payOnPickup, cashOnDelivery, bankTransfer, cardPayment]
          description: Payment method type
      responses:
        '200':
          description: Payment method updated
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /storefront-tokens:
    get:
      summary: List storefront tokens
      operationId: listStorefrontTokens
      tags: [Eshop]
    post:
      summary: Create storefront token
      operationId: createStorefrontToken
      tags: [Eshop]

  /api/storefront/v1/catalog:
    get:
      summary: Storefront catalog tree
      operationId: storefrontCatalog
      tags: [Storefront]

  /api/storefront/v1/categories:
    get:
      summary: Storefront categories
      operationId: storefrontCategories
      tags: [Storefront]

  /api/storefront/v1/products:
    get:
      summary: Storefront products
      operationId: storefrontProducts
      tags: [Storefront]

  /api/storefront/v1/products/{id}:
    get:
      summary: Storefront product detail
      operationId: storefrontProductDetail
      tags: [Storefront]

  /api/storefront/v1/skus:
    get:
      summary: Storefront SKUs
      operationId: storefrontSkus
      tags: [Storefront]

  /api/storefront/v1/delivery-methods:
    get:
      summary: Storefront delivery methods
      operationId: storefrontDeliveryMethods
      tags: [Storefront]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryMethod'
                  total:
                    type: integer
                description: >
                  For zasilkovna, zasilkovnaApiKey is returned only when
                  zasilkovnaPickupSelector is widget and a merchant key is set.

  /api/storefront/v1/delivery-methods/{type}/pickup-points:
    get:
      summary: Storefront pickup points for delivery method
      operationId: storefrontDeliveryPickupPoints
      tags: [Storefront]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [personalPickup, balikovna, ppl, zasilkovna]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: nearLat
          in: query
          description: >
            Latitude for distance sort and radius filter (carrier points only).
            Must be provided together with nearLng.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: nearLng
          in: query
          description: Longitude for distance sort and radius filter (carrier points only).
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusKm
          in: query
          description: Max distance in km when nearLat/nearLng are set. Default 20, max 100.
          schema:
            type: number
            format: double
            default: 20
            maximum: 100
      responses:
        '200':
          description: Pickup points for the delivery method
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/PickupPoint'
                        - $ref: '#/components/schemas/CarrierPickupPoint'
                  total:
                    type: integer

  /api/storefront/v1/payment-methods:
    get:
      summary: Storefront payment methods
      operationId: storefrontPaymentMethods
      tags: [Storefront]

  /api/storefront/v1/carts:
    post:
      summary: Create cart
      operationId: storefrontCreateCart
      tags: [Storefront]

  /api/storefront/v1/carts/{id}:
    get:
      summary: Get cart
      operationId: storefrontGetCart
      tags: [Storefront]

  /api/storefront/v1/carts/{id}/items:
    post:
      summary: Add cart item
      operationId: storefrontAddCartItem
      tags: [Storefront]

  /api/storefront/v1/carts/{id}/customer:
    patch:
      summary: Set cart customer
      operationId: storefrontSetCartCustomer
      tags: [Storefront]

  /api/storefront/v1/carts/{id}/delivery:
    patch:
      summary: Set cart delivery
      operationId: storefrontSetCartDelivery
      tags: [Storefront]

  /api/storefront/v1/carts/{id}/payment:
    patch:
      summary: Set cart payment
      operationId: storefrontSetCartPayment
      tags: [Storefront]

  /api/storefront/v1/carts/{id}/promotion:
    post:
      summary: Promote cart to order
      operationId: storefrontPromoteCart
      tags: [Storefront]

  /api/storefront/v1/orders/{id}/card-payment:
    post:
      summary: Initiate card payment
      operationId: storefrontCardPayment
      tags: [Storefront]

  /api/storefront/v1/orders/card-payment/callback:
    post:
      summary: Card payment callback
      operationId: storefrontCardPaymentCallback
      tags: [Storefront]

  /admin/subscription-plans:
    get:
      tags:
        - admin
      summary: List active subscription plans
      operationId: listAdminSubscriptionPlans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionPlan'
                  total:
                    type: integer

  /admin/accounts/{id}/subscriptions:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          description: Account KSUID
    get:
      tags:
        - admin
      summary: List subscriptions for account
      operationId: listAccountSubscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSubscription'
                  total:
                    type: integer
        '404':
          description: Account not found
        '400':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - admin
      summary: Create subscription for account
      operationId: createAccountSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: Account not found

  /admin/accounts/{id}/subscriptions/{subscriptionId}/activate:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          description: Account KSUID
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
          description: Subscription KSUID
    post:
      tags:
        - admin
      summary: Activate subscription
      operationId: activateAccountSubscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Conflict

  /admin/accounts/{id}/subscriptions/{subscriptionId}/revoke:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          description: Account KSUID
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
          description: Subscription KSUID
    post:
      tags:
        - admin
      summary: Revoke subscription
      operationId: revokeAccountSubscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /admin/accounts/{id}/subscriptions/{subscriptionId}/prolong:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          description: Account KSUID
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
          description: Subscription KSUID
    post:
      tags:
        - admin
      summary: Prolong subscription
      operationId: prolongAccountSubscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /admin/accounts/{id}/subscriptions/{subscriptionId}/payment-emails:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          description: Account KSUID
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
          description: Subscription KSUID
    post:
      tags:
        - admin
      summary: Send payment e-mail for subscription
      operationId: sendAccountSubscriptionPaymentEmail
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /admin/accounts/{id}/max-variant-axes:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          description: Account KSUID
    patch:
      tags:
        - admin
      summary: Update max variant axes for account
      description: Admin-only. Sets the maximum number of variant axes that can be assigned to products on the account.
      operationId: "updateAccountMaxVariantAxes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maxVariantAxes
              properties:
                maxVariantAxes:
                  type: integer
                  minimum: 1
                  description: Maximum number of variant axes per product.
                  example: 3
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: Account not found

components:
  schemas:
    AuthTokens:
      type: object
      required:
        - id
        - token
        - refreshToken
        - expires
      properties:
        id:
          type: string
          description: User ID
          example: "1"
        token:
          type: string
          description: "JWT access token. Send it as `Authorization: Bearer <token>`."
          example: "eyJhbGciOiJIUzI1Ni"
        refreshToken:
          type: string
          description: Token for `POST /auth/refresh`.
        expires:
          type: string
          format: date-time
          description: Expiration of the access token.
          example: "2023-03-01T00:00:00Z"

    Me:
      type: object
      properties:
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        sia:
          type: boolean
          description: Whether the subscription of the account is active.
        subscriptionEndsAt:
          type: [string, 'null']
          format: date-time
        currentAccountId:
          type: [string, 'null']
          description: Account of this request. For Bearer token clients, it is the account of the token.
        accounts:
          type: array
          description: Present only when the user has more than one account.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              isPrimary:
                type: boolean
        fpr:
          type: string
          description: Present when the user must change the password.

    Error:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: Unique identification of the error.
        status:
          type: integer
          description: HTTP status code for convenience.
        code:
          type: integer
          description: Numeric code uniquely identifying the error. Note that codes are NOT unique across endpoints.
          example: 40001
        title:
          type: string
          description: Message uniquely identifying the error.
        detail:
          type: string
          description: Request specific description of the error.

    DeliveryMethod:
      type: object
      properties:
        type:
          type: string
          enum: [personalPickup, ceskaPosta, balikovna, ppl, zasilkovna]
        isEnabled:
          type: boolean
        supportedProductTypes:
          type: array
          items:
            type: string
        prices:
          type: array
          items:
            type: object
        allowedPaymentMethods:
          type: array
          items:
            type: string
        zasilkovnaPickupSelector:
          type: [string, 'null']
          enum: [widget, feed]
          description: Pickup point UI mode for Zásilkovna. Null for other delivery types.
        zasilkovnaApiKey:
          type: [string, 'null']
          description: >
            Per-account Packeta API key for widget mode and future Packeta API calls.
            Not the platform sync key. On storefront responses, returned only when
            selector is widget and a key is configured.
        balikovnaPickupSelector:
          type: [string, 'null']
          enum: [widget, feed]
          description: Pickup point UI mode for Balíkovna. Null for other delivery types.

    PatchDeliveryMethod:
      type: object
      properties:
        isEnabled:
          type: boolean
        supportedProductTypes:
          type: array
          items:
            type: string
        prices:
          type: object
          additionalProperties: true
        allowedPaymentMethods:
          type: array
          items:
            type: string
        zasilkovnaPickupSelector:
          type: string
          enum: [widget, feed]
        zasilkovnaApiKey:
          type: [string, 'null']
          description: Merchant Packeta API key. Empty string clears the stored key.
        balikovnaPickupSelector:
          type: string
          enum: [widget, feed]

    PickupPoint:
      type: object
      description: Account-owned personal pickup point
      properties:
        id:
          type: string
        name:
          type: string
        street:
          type: string
        city:
          type: string
        zip:
          type: string
        country:
          type: string
        note:
          type: [string, 'null']
        openingHours:
          type: [string, 'null']
        isActive:
          type: boolean

    CarrierPickupPoint:
      type: object
      description: Synced carrier pickup point (Zásilkovna, PPL, Balíkovna)
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [balikovna, ppl, zasilkovna]
        externalId:
          type: string
        name:
          type: string
        street:
          type: string
        city:
          type: string
        zip:
          type: string
        country:
          type: string
        latitude:
          type: [string, 'null']
        longitude:
          type: [string, 'null']
        distanceKm:
          type: number
          format: double
          description: Present when the request included nearLat/nearLng.

    Address:
      type: object
      properties:
        address:
          type: string
          description: Street and house number
          example: Hradčanská 1
        city:
          type: string
          example: Praha
        zip:
          type: string
          description: Postal code
          example: 110 00
        country:
          type: string
          example: Česká Republika

    BankAccount:
      type: object
      required:
        - id
        - name
        - bankAccount
        - currency
        - balance
        - balanceSetAt
        - lastFetch
        - fetchEnabled
        - fetchDisabledReason
      properties:
        id:
          type: string
          format: ksuid
          description: KSUID of the bank account
        name:
          type: string
          description: Name of the bank account
        bankAccount:
          type: object
          required:
            - accountNumber
            - bankCode
            - iban
            - bic
          properties:
            accountNumber:
              type: string
              description: Account number of the bank account
            bankCode:
              type: string
              description: Bank code of the bank account
            iban:
              type: [string, 'null']
              description: IBAN of the bank account
            bic:
              type: [string, 'null']
              description: BIC of the bank account
        currency:
          type: string
          description: ISO currency format.
          example: CZK
        balance:
          $ref: '#/components/schemas/Money'
          description: Balance of the bank account
        balanceSetAt:
          type: [string, 'null']
          format: date-time
          description: Date and time when the balance was manually set
        lastFetch:
          type: [string, 'null']
          format: date-time
          description: Date and time of the last fetch of the bank account transactions
        fetchEnabled:
          type: string
          enum:
            - enabled
            - disabled
          description: Whether fetching of the bank account transactions is enabled
        fetchDisabledReason:
          type: [string, 'null']
          enum:
            - token_expired
          description: Why transaction fetching was disabled (null when enabled or manually disabled).

    BankAccountTransaction:
      type: object
      properties:
        id:
          type: string
          format: numeric-string
          description: Numeric ID of the bank account transaction
        externalId:
          type: [string, 'null']
          description: External ID of the bank account transaction
        date:
          type: string
          format: date-time
          description: Date of the bank account transaction
        amount:
          $ref: '#/components/schemas/Money'
          description: Amount of the bank account transaction
        payer:
          type: [string, 'null']
          description: Payer as provided by the bank
        message:
          type: [string, 'null']
          description: Message as provided by the bank
        note:
          type: [string, 'null']
          description: Note as provided by the bank
        comment:
          type: [string, 'null']
          description: Comment as provided by the bank
        vs:
          type: [string, 'null']
          format: numeric-string
          description: Variable symbol
        ss:
          type: [string, 'null']
          format: numeric-string
          description: Specific symbol
        ks:
          type: [string, 'null']
          format: numeric-string
          description: Constant symbol

    Currency:
      type: object
      properties:
        code:
          type: string
          description: ISO currency format.
          example: CZK
        name:
          type: string
          description: Full name of the currency
          example: Česká koruna
        symbol:
          type: string
          description: Symbol of the currency
          example: Kč

    Document:
      type: object
      properties:
        symbol:
          type: string
          example: '20230012'
        uuid:
          type: string
          format: uuid
          example: '9961d718-cae7-48e9-845d-e5c21f4ecdb3'
        issuedAt:
          type: string
          format: date-time
          description: Date of issuance that appears on the document
        deadlineAt:
          type: string
          format: date-time
          description: Date until when one wants the payment to be made
        paidAt:
          type: [string, 'null']
          format: date-time
          description: Date of payment that appears on the document
        paymentMethod:
          type: string
          enum:
            - bankTransfer
            - cash
            - card
            - cod
            - other
        status:
          type: string
          enum:
            - issued
            - sent
            - paidPartially
            - paid
            - overpaid
            - overdue
            - cancelled
            - refunded
          description: |
            Initial status of the document is `issued`.

            | Status | Description |
            | ------ | ----------- |
            | `issued` | document was created and is waiting for payment |
            | `sent` | document was sent to the customer |
            | `paid` | document was paid |
            | `overdue` | document is not paid and is past the deadline |
            | `cancelled` | document was cancelled |
        description:
          type: [string, 'null']
          description: Line of text that appears above the list of document items
        vs:
          type: string
          format: numeric-string
          description: Variable symbol
        ss:
          type: string
          format: numeric-string
          description: Specific symbol
        ks:
          type: string
          format: numeric-string
          description: Constant symbol
        createdAt:
          type: string
          format: date-time
          description: Date of creation of the document
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: Date of last modification of the document
        customer:
          $ref: '#/components/schemas/Participant'
        supplier:
          $ref: '#/components/schemas/Participant'
        supplierBankAccount:
          description: |
            Overridden supplier bank account for this document.
            If null, the supplier's default account from ParticipantData is used.
          anyOf:
            - type: object
              properties:
                accountNumber:
                  type: [string, 'null']
                bankCode:
                  type: [string, 'null']
                iban:
                  type: [string, 'null']
                bic:
                  type: [string, 'null']
            - type: 'null'
        beneficiary:
          anyOf:
            - $ref: '#/components/schemas/Participant'
            - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
        currency:
          type: string
          description: ISO currency format.
          example: CZK

    DocumentItem:
      type: object
      required:
        - amount
        - unit
        - description
        - unitPriceTaxFree
        - unitTax
        - unitPrice
        - totalPriceTaxFree
        - totalTax
        - totalPrice
      properties:
        amount:
          type: number
          format: float
          description: Quantity of the item
        unit:
          type: string
          description: Unit of the item
          example: "h"
        description:
          type: string
          description: Description of the item
        skuId:
          type: string
          nullable: true
          description: Optional SKU reference for stock-tracked catalog items
        lineExtras:
          type: array
          description: Selected parameter surcharges / extras captured on the line.
          items:
            $ref: '#/components/schemas/DocumentItemLineExtra'
        unitPriceTaxFree:
          description: Price excluding VAT of a single unit of the item. Is the same as unit unitPrice if no VAT is defined.
          allOf: # todo this nest is a hack for openapi 3.0, see https://github.com/OAI/OpenAPI-Specification/issues/1514#issuecomment-1386613645
            - $ref: "#/components/schemas/Money"
        unitTax:
          description: Tax on a single unit of the item. Is be zero if no VAT is defined.
          allOf:
            - $ref: "#/components/schemas/Money"
        unitPrice:
          description: Unit price of a single unit of the item
          allOf:
            - $ref: "#/components/schemas/Money"
        taxRate:
          type: integer
          description: Tax rate applied on the item
        totalPriceTaxFree:
          description: Price excluding VAT of the whole item. Is the same as unit totalPrice if no VAT is defined.
          allOf:
            - $ref: "#/components/schemas/Money"
        totalTax:
          description: Tax on the whole item. Is be zero if no VAT is defined.
          allOf:
            - $ref: "#/components/schemas/Money"
        totalPrice:
          description: Total price of the whole item
          allOf:
            - $ref: "#/components/schemas/Money"

    DocumentItem_Create:
      type: object
      required:
        - amount
        - unit
        - description
        - unitPrice
      properties:
        amount:
          type: number
          format: float
          description: Quantity of the item
        unit:
          type: string
          description: Unit of the item
          example: "h"
        description:
          type: string
          description: Description of the item
        skuId:
          type: string
          nullable: true
          description: Optional SKU reference for stock-tracked catalog items
        lineExtras:
          type: array
          description: Selected parameter surcharges / extras to capture on the line.
          items:
            $ref: '#/components/schemas/DocumentItemLineExtra'
        unitPrice:
          description: Price of a single unit of the item.
          allOf: # todo this nest is a hack for openapi 3.0, see https://github.com/OAI/OpenAPI-Specification/issues/1514#issuecomment-1386613645
            - $ref: "#/components/schemas/Money"
        taxRate:
          type: integer
          description: Tax rate applied on the item. Required for VAT payer.
        computation:
          type: string
          enum:
            - bottomUp
            - topDown
          description: |
            Method of computation of the price including tax. Default value is `bottomUp`.
            `bottomUp` means that the price is provided as base and tax is added to it.
            `topDown` means that the price is provided as total and tax is deducted from it.
            Value is irrelevant for non-VAT payers.

    DocumentItemLineExtra:
      type: object
      properties:
        parameterId:
          type: string
        parameterCode:
          type: string
        parameterName:
          type: string
        valueId:
          type: string
        valueLabel:
          type: string
        rawValue: {}
        priceDelta:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string

    Expense:
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          required:
            - expenseType
            - receivedAt
          properties:
            expenseType:
              type: string
              enum:
                - invoice
                - receipt
                - other
            receivedAt:
              type: string
              format: date-time
              description: Date the receipt/invoice was received
            taxableAt:
              type: string
              format: date-time
              description: Date of VAT applicability (DUZP in CZE)
            attachment:
              type: string
              format: binary
              description: File attachment of the expense, e.g. PDF invoice, photo of receipt, etc.
            vatDeductible:
              type: boolean
              description: Whether the VAT is deductible or not. Only for VAT payers.
            vatDeductionProportionPercent:
              type: string
              format: decimal
              description: |
                Proportion of VAT deduction in percent. Only for VAT payers. Value is decimal string with 4 decimal places.
                Can be only whole numbers, but future-proof.
              example: "50.0000"

    Invoice:
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          properties:
            taxableAt:
              type: string
              format: date-time
              description: Date of VAT applicability (DUZP in CZE)
            order:
              type: [string, 'null']
              description: Reference to Order ID.

    Order:
      allOf:
        - $ref: '#/components/schemas/Document'

    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Amount of currency in cents, e.g. 1000 means 10.00 EUR
          example: "1250"
        currency:
          type: string
          description: ISO currency format.
          example: EUR
      required:
        - amount
        - currency

    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        duration:
          type: integer
        status:
          type: string
        options:
          type: object

    SubscriptionUnpaidOrder:
      type: object
      properties:
        vs:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        accountNumber:
          type: string
        iban:
          type: string

    AdminSubscription:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - requested
            - scheduled
            - active
            - expired
            - revoked
        startDate:
          type: [string, 'null']
          format: date-time
        endDate:
          type: [string, 'null']
          format: date-time
        price:
          $ref: '#/components/schemas/Money'
        plan:
          $ref: '#/components/schemas/SubscriptionPlan'
        unpaidOrder:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionUnpaidOrder'
            - type: 'null'

    SubscriptionCreate:
      type: object
      required:
        - subscriptionPlanId
        - startDate
        - endDate
      properties:
        subscriptionPlanId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        price:
          $ref: '#/components/schemas/Money'

    DocumentSequence:
      type: object
      required:
        - type
        - name
        - prefix
        - format
        - sequenceLength
        - default
      properties:
        id:
          type: string
          description: ID of the DocumentSequence in `seq_<string>` KSUID format.
          example: seq_2udYHpoPWQeAazs1GOWA7BEZxUc
        type:
          type: string
          description: Type of the document sequence is for
          enum:
            - invoice
            - order
            - expense
        name:
          type: string
          description: Name of the document sequence
          example: Default sequence
        prefix:
          type: string
          description: Prefix of the document sequence
          example: "N"
        format:
          type: string
          format: string
          description: Format of the Document sequence. `Y` is for full year (e.g. 2025), `y` is for short year (e.g. 25), `m` is for month (e.g. 03), `d` is for day (e.g. 12).
          example: "Y"
        sequenceLength:
          type: integer
          minimum: 3
          maximum: 7
          description: How many digits the sequence number has
        default:
          type: boolean
          description: Whether the sequence is default for the account

    Notification:
      type: object
      required:
        - type
        - title
        - content
        - createdAt
      properties:
        type:
          type: string
          description: Type of the notification
          enum:
            - info
            - warning
            - error
            - success
        title:
          type: string
          description: Title of the notification
          example: Invoice 20250012 was paid
        content:
          type: string
          description: Long description of the notification
          example: Invoice with symbol 20250012 was paid on 2025-03-12.
        createdAt:
          type: string
          format: date-time
          description: Date when notification was created
          example: 2025-03-12T15:23:34Z
        readAt:
          type: [string, 'null']
          format: date-time
          description: Date of reading the notification

    Participant:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: ID of the Participant in `part_<string>` KSUID format.
          example: part_192
        name:
          type: string
          description: Full name of the participant
        company:
          type: string
          description: Optional company name of the participant. If filled, appears on the invoice instead of name.
        email:
          type: string
          format: email
          example: email@example.com
        phone:
          type: string
          example: "603112233"
        ico:
          type: [string, 'null']
          description: Company identification number, may not be present (e.g. end consumer)
          example: "45274649"
        dic:
          type: [string, 'null']
          description: Tax identification number (TIN), may not be presenter
          example: CZ45274649
        vatPayer:
          type: string
          enum:
            - identifiedPerson
            - noVatPayer
            - vatPayer
        vatPayerReliability:
          type: [string, 'null']
          enum:
            - reliable
            - notReliable
            - unknown
          description: Reliability of the VAT payer. `null` if Participant is not vatPayer. `unknown` may indicate that Participant is not VAT payer or is not in ARES anymore.
        accountNumber:
          type: string
          description: Account number including bank code
          example: 1234567890/0000
        iban:
          type: [string, 'null']
        defaultBankAccountId:
          type: [string, 'null']
          description: KSUID of the default InvoicingBankAccount to preselect when issuing invoices for this contact.
        address:
          $ref: '#/components/schemas/Address'

    Settings:
      type: object
      required:
        - footnote
        - participantId
        - participant
        - vatPayer
        - signature
        - primaryCurrency
        - alternativeCurrencies
        - yearOfRegistration
      properties:
        footnote:
          type: [string, 'null']
          description: Footnote that appears on the Documents
          example: "Thank you for your purchase."
        participantId:
          type: [string, 'null']
          description: ID of the Participant that is used for the Documents. `null` if not set yet, e.g. after first login.
          example: "part_123"
        participant:
          description: Supplier information that is used for the Documents. `null` if not set yet, e.g. after first login.
          anyOf:
            - $ref: "#/components/schemas/Participant"
            - type: 'null'
        vatPayer:
          type: string
          enum:
            - identifiedPerson
            - noVatPayer
            - vatPayer
        signature:
          type: [string, 'null']
          description: |
            File name of the watermark that appears on the Documents.
            Uploaded image should contain stamp or signature.
        primaryCurrency:
          type: string
          description: ISO currency format.
        alternativeCurrencies:
          type: [array, 'null']
          items:
            type: string
            description: ISO currency format.
        yearOfRegistration:
          type: integer
          description: Year of registration of the account, used for determining what years are in year paginator.
          example: 2023
        eshopPriceMode:
          type: string
          enum:
            - live
            - snapshot
          description: How cart item prices are resolved when the cart is read or updated.
        addressRequirement:
          type: string
          enum:
            - always
            - whenAddressDelivery
            - never
          description: When checkout requires a shipping address before promoting a cart to an order.
        maxVariantAxes:
          type: integer
          description: Maximum number of variant axes that can be assigned to a product.
          example: 3
        features:
          type: array
          items:
            type: string
          description: List of enabled features for the account.
          example:
            - beneficiary
            - multiCurrency
            - bank

    BankNotificationSettings:
      type: object
      required:
        - forwardingEmail
        - supportedBanks
      properties:
        forwardingEmail:
          type: [string, 'null']
          description: Email address to forward bank payment notifications to. Null when not configured on the server.
          example: a1b2c3d4@platby.invo.space
        supportedBanks:
          type: array
          items:
            type: string
          description: Banks whose payment notification emails are supported.
          example:
            - Air bank

    CreateSimpleExpenseRequest:
      type: object
      required:
        - receivedAt
        - attachments
      properties:
        receivedAt:
          type: string
          format: date-time
          description: Date the receipt/invoice was received
        description:
          type: string
          description: Simple description of the expense. Useful for accountants.
        attachments:
          type: array
          items:
            type: string
            format: binary
          minItems: 1
          maxItems: 3
          description: File attachments of the expense, e.g. PDF invoice, photo of receipt, etc.

    CreateDocumentRequest:
      type: object
      required:
        - customer
        - deadlineAt
        - items
      properties:
        symbol:
          description: Actually a custom symbol (identification) of the Document from your system
          type: [string, 'null']
        customer:
          anyOf:
            - type: string
              description: Internal ID of Customer
            - $ref: '#/components/schemas/Participant'
        beneficiary:
          description: Beneficiary feature must be enabled for the account.
          anyOf:
            - type: string
              description: Internal ID of customer
            - $ref: '#/components/schemas/Participant'
            - type: 'null'
        issuedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Date of issuance that appears on the document.
            May be provided in relative format, e.g. '+1 day'.
            Current date if not provided.
        paidAt:
          type: [string, 'null']
          format: date-time
          description: |
            Date of payment that appears on the document.
            May be provided in relative format, e.g. '+1 day'.
            Invoice will not be marked as paid if not provided or null.
        deadlineAt:
          type: string
          format: date-time
          description: |
            Date until when one wants the payment to be made.
            May be provided in relative format, e.g. '+15 days'.
        paymentMethod:
          type: string
          enum:
            - bankTransfer
            - cash
            - card
            - cod
            - other
        description:
          type: string
          description: Line of text that appears above the list of document items.
        vs:
          type: string
          description: Variable symbol
        ss:
          type: string
          description: Specific symbol
        ks:
          type: string
          description: Constant symbol
        currency:
          type: string
          description: ISO currency format.
          example: CZK
        bankAccountId:
          type: [string, 'null']
          description: |
            KSUID of the InvoicingBankAccount to use as the supplier's bank account on the document.
            If not provided, the system uses: customer's default bank account > account's default bank account > supplier's ParticipantData account.
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem_Create'
          minItems: 1

    DocumentIdentificationResponse:
      type: object
      properties:
        id:
          type: string
          description: Internal ID of the created Document. Currently it is sequence number of the Document.
          example: "20230001"
        symbol:
          type: string
          description: Sequence number of the created Document.
          example: "20230001"
        uuid:
          type: string
          format: uuid
          description: UUID of the created Document.
          example: 9961d718-cae7-48e9-845d-e5c21f4ecdb3
        permalink:
          type: string
          format: url
          description: Permanent link leading to PDF version of the Document.

    PatchDocumentRequest:
      type: object
      properties:
        customer:
          anyOf:
            - type: string
              description: Internal ID of Customer
            - $ref: '#/components/schemas/Participant'
        beneficiary:
          description: Beneficiary feature must be enabled for the account.
          anyOf:
            - type: string
              description: Internal ID of customer
            - $ref: '#/components/schemas/Participant'
            - type: 'null'
        issuedAt:
          type: string
          format: date-time
          description: |
            Date of issuance that appears on the document.
            May be provided in relative format, e.g. '+1 day'.
            Current date if not provided.
        paidAt:
          type: [string, 'null']
          format: date-time
          description: |
            Date of payment that appears on the document.
            May be provided in relative format, e.g. '+1 day'.
            Invoice will not be marked as paid if not provided or null.
        deadlineAt:
          type: string
          format: date-time
          description: |
            Date until when one wants the payment to be made.
            May be provided in relative format, e.g. '+15 days'.
        sentAt:
          type: string
          format: date-time
          description: |
            Date of document submission to the customer.
            Setting this field influences whether the status of the document is `issued` or `sent` (if `paidAt` field is null and not past deadline).
        description:
          type: string
          description: Line of text that appears above the list of document items.
        vs:
          type: string
          description: Variable symbol
        ss:
          type: string
          description: Specific symbol
        ks:
          type: string
          description: Constant symbol
        currency:
          type: string
          description: ISO currency format.
          example: CZK
        bankAccountId:
          type: [string, 'null']
          description: KSUID of the InvoicingBankAccount to use as the supplier's bank account on the document.
        items:
          type: array
          description: Items will be replaced as a whole.
          items:
            $ref: '#/components/schemas/DocumentItem_Create'
          minItems: 1

    PatchDocumentResponse:
      type: object
      properties:
        id:
          type: string
          description: Internal ID of the created Document. Currently it is sequence number of the Document.
          example: "20230001"
        symbol:
          type: string
          description: Sequence number of the created Document.
          example: "20230001"
        uuid:
          type: string
          format: uuid
          description: UUID of the created Document.
          example: 9961d718-cae7-48e9-845d-e5c21f4ecdb3
        permalink:
          type: string
          format: url
          description: Permanent link leading to PDF version of the Document.

    ReceiptLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID4 of the Receipt line
        amount:
          type: number
          format: float
          description: Quantity of the item
        unitPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Price of a single unit of the item including VAT.
        unitPriceTaxFree:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Price of a single unit of the item excluding VAT.
        unitTax:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Tax on a single unit of the item.
        taxRate:
          type: [integer, 'null']
          description: Tax rate applied on the item or null if VAT is not applicable.
        description:
          type: string
          description: Description of the item, if product is set, then description does not take effect.
        product:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Product/properties/id'
            name:
              $ref: '#/components/schemas/Product/properties/name'
        skuId:
          type: string
          description: Internal ID of the SKU associated with the receipt line.
        sku:
          type: object
          description: Resolved SKU details when skuId is set and the SKU exists.
          properties:
            id:
              type: string
              description: KSUID with sku_ prefix.
            name:
              type: string
              description: Display name of the SKU variant.
            code:
              type: string
              description: Unique SKU code.
            isSystem:
              type: boolean
              description: True for the auto-created hidden SKU.
        label:
          type: string
          description: Display label combining product and variant name when applicable.
        sale:
          type: object
          description: Optional sale applied to the receipt line. When present, the object MUST contain both `type` and `value`.
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - none
                - absolute
                - percent
              description: Type of sale applied to the line.
            value:
              type: integer
              minimum: 1
              description: Positive integer value of the sale. For `absolute` this is amount in smallest currency unit (e.g. cents), for `percent` this is percentage points (e.g. 10 means 10%).
      required:
        - id
        - amount
        - unitPrice
        - unitPriceTaxFree
        - unitTax
        - taxRate

    Receipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID4 of the Receipt
        supplier:
          type: object
          required: [ico, dic]
          properties:
            ico:
              type: [string, 'null']
              description: Company identification number
            dic:
              type: [string, 'null']
              description: Tax identification number (TIN)
        issuedAt:
          type: string
          format: date-time
          description: Time of the sale. It appears on the receipt and is used for EET, summaries and date filters.
        createdAt:
          type: string
          format: date-time
          description: Time when the server recorded the Receipt. Later than `issuedAt` when an offline client syncs the Receipt later.
        paymentType:
          type: string
          enum:
            - Cash
            - Card
            - Qr
        warehouseId:
          type: string
          nullable: true
          description: Warehouse from which stock was deducted for this sale (wh_ prefixed KSUID). Defaults to the cash register settings warehouse when omitted.
        receiptLines:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptLine'
        references:
          type: array
          description: Documents linked to the Receipt.
          items:
            type: object
            required: [target, targetType]
            properties:
              target:
                type: string
              targetType:
                type: string
      required: [id, supplier, issuedAt, createdAt, paymentType, warehouseId, receiptLines, references]

    EetStatus:
      type: object
      required: [country, isCzech, enabled, environment, verificationMode, idProvozovny, configured, setupRequired, deadlineWarning, certificates]
      properties:
        country:
          type: [string, 'null']
          description: Country of the account's supplier.
        isCzech:
          type: boolean
        enabled:
          type: boolean
        environment:
          type: string
          enum: [playground, test, production]
        verificationMode:
          type: boolean
        idProvozovny:
          type: integer
          nullable: true
        configured:
          type: boolean
        setupRequired:
          type: boolean
        deadlineWarning:
          type: boolean
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/EetCertificateInfo'

    EetCertificateInfo:
      type: object
      required: [eic, serialNumber, validFrom, validTo, environment, isValid, expiresSoon, daysUntilExpiry]
      properties:
        eic:
          type: string
          example: CZ00000019
        serialNumber:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        environment:
          type: string
          enum: [playground, test, production]
        isValid:
          type: boolean
        expiresSoon:
          type: boolean
        daysUntilExpiry:
          type: integer

    UploadEetCertificateRequest:
      type: object
      required:
        - certificate
        - password
      properties:
        certificate:
          type: string
          description: Base64-encoded PKCS#12 certificate
        password:
          type: string
          description: Password for the PKCS#12 certificate
        environment:
          type: string
          enum: [playground, test, production]
          default: playground

    ConfigureEetSettingsRequest:
      type: object
      required:
        - enabled
        - environment
        - verificationMode
        - idProvozovny
      properties:
        enabled:
          type: boolean
        environment:
          type: string
          enum: [playground, test, production]
        verificationMode:
          type: boolean
        idProvozovny:
          type: integer
          minimum: 1
          maximum: 999999999

    EetSubmission:
      type: object
      required: [id, receiptId, messageUuid, status, fik, datTrzby, celkTrzba, sentAt, receivedAt, prvniZaslani, attempts, errorCode, errorMessage, warnings]
      properties:
        id:
          type: integer
        receiptId:
          type: string
          format: uuid
        messageUuid:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, rejected, offline]
        fik:
          type: string
          nullable: true
          description: Fiscal identification code (FIK) from EET
        datTrzby:
          type: string
          format: date-time
        celkTrzba:
          type: string
        sentAt:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
          nullable: true
        prvniZaslani:
          type: boolean
        attempts:
          type: integer
        errorCode:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            type: integer
          nullable: true

    SummaryRow:
      type: object
      properties:
        total:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Total revenue including VAT
        totalTax:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Total VAT amount
        totalTaxFree:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Total price excluding VAT
      required:
        - total
        - totalTax
        - totalTaxFree

    Summary:
      type: object
      description: |
        Totals of the receipts in the period. `byType` and `byTax` contain only keys with receipts;
        with no receipts they are empty (sent as an empty JSON array).
      properties:
        total:
          allOf:
            - $ref: "#/components/schemas/SummaryRow"
          description: Totals of all receipts
        byType:
          type: object
          properties:
            Cash:
              $ref: '#/components/schemas/SummaryRow'
            Card:
              $ref: '#/components/schemas/SummaryRow'
            Qr:
              $ref: '#/components/schemas/SummaryRow'
          description: Summary broken down by payment type
        byTax:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SummaryRow'
          description: Summary broken down by tax rate (key is the rate in percent, "0" for lines without VAT)
      required:
        - total
        - byType
        - byTax

    Category:
      type: object
      properties:
        id:
          type: string
          description: KSUID id of the category
        name:
          type: string
        slug:
          type: string
        parentId:
          type: [string, 'null']
        externalId:
          type: [string, 'null']
        position:
          type: [integer, 'null']
        createdAt:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
        - id
        - name
        - slug

    CategoryCreate:
      type: object
      properties:
        name:
          type: string
        parent:
          type: [string, 'null']
        children:
          type: array
          items:
            type: string
        externalId:
          type: [string, 'null']
        position:
          type: [integer, 'null']
      required:
        - name

    CategoryPatch:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: [string, 'null']
        externalId:
          type: [string, 'null']
        position:
          type: [integer, 'null']

    Product:
      type: object
      properties:
        id:
          type: string
          description: KSUID with pr_ prefix.
          example: pr_2udYHpoPWQeAazs1GOWA7BEZxUc
        productType:
          type: string
          enum:
            - physical
            - virtual
            - service
            - package
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        mainCategoryId:
          type: [string, 'null']
        secondaryCategoryIds:
          type: array
          items:
            type: string
        externalId:
          type: [string, 'null']
        isActive:
          type: boolean
        variantAxes:
          type: array
          items:
            type: object
            properties:
              axisId:
                type: string
              sortOrder:
                type: integer
              axis:
                type: object
                properties:
                  id:
                    type: string
                  code:
                    type: string
                  name:
                    type: string
                  valueType:
                    $ref: '#/components/schemas/ParameterValueType'
        parameters:
          type: array
          items:
            type: object
            properties:
              parameterId:
                type: string
              sortOrder:
                type: integer
              isRequired:
                type: boolean
              parameter:
                type: object
                properties:
                  id:
                    type: string
                  code:
                    type: string
                  name:
                    type: string
                  valueType:
                    $ref: '#/components/schemas/ParameterValueType'
                  isDescriptive:
                    type: boolean
                  isFilterable:
                    type: boolean
                  isSurcharge:
                    type: boolean
        descriptiveValues:
          type: array
          items:
            type: object
            properties:
              parameterId:
                type: string
