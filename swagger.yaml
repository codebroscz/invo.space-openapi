          example: '1234567890'
        bankCode:
          type: [string, 'null']
          description: Bank code
          example: '2010'
        iban:
          type: [string, 'null']
          description: IBAN
          example: CZ6508000000001234567890
        bic:
          type: [string, 'null']
          description: BIC/SWIFT code
        isDefault:
          type: boolean
          description: Whether this is the default bank account for the tenant
        sourceBankAccountId:
          type: [string, 'null']
          description: ID of the linked synced BankAccount entity (Fio/Moneta/Raiffeisen/Erste), if any

    CreateInvoicingBankAccountRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: User-friendly label
        accountNumber:
          type: [string, 'null']
        bankCode:
          type: [string, 'null']
        iban:
          type: [string, 'null']
        bic:
          type: [string, 'null']
        isDefault:
          type: boolean
          default: false
        sourceBankAccountId:
          type: [string, 'null']
          description: If provided, bank account details are copied from the linked BankAccount entity.

    UpdateInvoicingBankAccountRequest:
      type: object
      properties:
        name:
          type: string
        accountNumber:
          type: [string, 'null']
        bankCode:
          type: [string, 'null']
        iban:
          type: [string, 'null']
        bic:
          type: [string, 'null']
        isDefault:
          type: boolean

    RaiffeisenAvailableAccount:
      type: object
      properties:
        accountId:
          type: integer
          description: ID of the account in the Raiffeisen API.
          example: 123
        accountName:
          type: string
        accountNumber:
          type: string
          example: '1234567890'
        accountNumberPrefix:
          type: [string, 'null']
        bankCode:
          type: string
          example: '5500'
        iban:
          type: string
          example: CZ6555000000001234567890
        bankBicCode:
          type: [string, 'null']
        friendlyName:
          type: [string, 'null']
        accountTypeId:
          type: string
        mainCurrency:
          type: [string, 'null']
          example: CZK

    ErsteAvailableAccount:
      type: object
      properties:
        accountId:
          type: string
          description: Resource ID of the account in the Erste API.
        accountName:
          type: string
        accountNumber:
          type: string
          example: '1234567890'
        accountNumberPrefix:
          type: [string, 'null']
        bankCode:
          type: string
          example: '0800'
        iban:
          type: string
          example: CZ6508000000001234567890
        bankBicCode:
          type: [string, 'null']
        friendlyName:
          type: [string, 'null']
        accountTypeId:
          type: string
        mainCurrency:
          type: [string, 'null']
          example: CZK

    SyncedBankAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the bank account.
        bankAccount:
          type: object
          properties:
            accountNumber:
              type: string
              example: '1234567890'
            bankCode:
              type: string
              example: '5500'
            iban:
              type: string
              example: CZ6555000000001234567890
            bic:
              type: [string, 'null']
        name:
          type: string
          description: Friendly name of the bank account.
        balance:
          type: [number, 'null']
          description: Current balance of the account.
        currency:
          type: string
          description: ISO currency code.
          example: CZK
        lastFetch:
          type: [string, 'null']
          format: date-time
          description: Date of the last successful transaction fetch.
        fetchEnabled:
          type: string
          enum:
            - enabled
            - disabled
          description: Whether automatic transaction fetching is enabled.
        fetchDisabledReason:
          type: [string, 'null']
          enum:
            - token_expired
          description: Why transaction fetching was disabled (null when enabled or manually disabled).

  parameters:
    date:
      name: date
      in: query
      required: false
      schema:
        type: string
        description: Date in YYYY-MM-DD format
        example: 2023-03-15
    year:
      name: year
      in: query
      required: false
      schema:
        type: integer
        description: Year in four digit format YYYY
        example: 2023
    month:
      name: month
      in: query
      required: false
      schema:
        type: integer
        description: Month in non-zerofilled format
        example: 3
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: [integer, 'null']
        default: null
        description: Number of items to return
        example: 10
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        description: Number of items to skip
        example: 10
    orderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        description: 'Comma-separated list of field:direction pairs for sorting (e.g. id:desc,name:asc).'
        example: 'id:desc'

  requestBodies:
    CreateExpense:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CreateSimpleExpenseRequest'
              -
                allOf:
                  - $ref: '#/components/schemas/CreateDocumentRequest'
                  - type: object
                    required:
                      - expenseType
                      - receivedAt
                    properties:
                      expenseType:
                        type: string
                        enum:
                          - invoice
                          - receipt
                          - other
                      receivedAt:
                        type: string
                        format: date-time
                        description: Date the receipt/invoice was received
                      taxableAt:
                        type: [string, 'null']
                        format: date-time
                        description: |
                          Date of VAT applicability.
                          Required for invoices created by VAT payers. Not allowed for non-VAT payers.
                      attachment:
                        type: string
                        format: binary
                        description: File attachment of the expense, e.g. PDF invoice, photo of receipt, etc.
                      vatDeductible:
                        type: boolean
                        description: Whether the VAT is deductible or not. Only for VAT payers.
                      vatDeductionProportionPercent:
                        type: number
                        format: decimal
                        description: Proportion of VAT deduction in percent. Only for VAT payers.

    CreateInvoice:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CreateDocumentRequest'
              - type: object
                properties:
                  order:
                    type: [string, 'null']
                    description: Reference to Internal Order ID.
                  taxableAt:
                    type: [string, 'null']
                    format: date-time
                    description: |
                      Date of VAT applicability.
                      May be provided in relative format, e.g. '+1 day'.
                      Required for invoices created by VAT payers. Not allowed for non-VAT payers.

    CreateOrder:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - document
            properties:
              document:
                $ref: '#/components/schemas/CreateDocumentRequest'
              email:
                type: object
                required:
                  - recipient
                  - replyTo
                  - subject
                  - messageText
                properties:
                  recipient:
                    type: string
                    format: email
                  replyTo:
                    type: string
                    format: email
                  cc:
                    type: array
                    items:
                      type: string
                      format: email
                  subject:
                    type: string
                    example: Thank you for your order
                  messageText:
                    type: string
                    example: |
                      Hello,

                      thank you for your order. Please see the attached order with payment information.

    PatchInvoice:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PatchDocumentRequest'
              - type: object
                properties:
                  order:
                    type: [string, 'null']
                    description: Reference to Internal Order ID.
                  taxableAt:
                    type: [string, 'null']
                    format: date-time
                    description: |
                      Date of VAT applicability.
                      May be provided in relative format, e.g. '+1 day'.
                      Required for invoices created by VAT payers. Not allowed for non-VAT payers.

    PatchOrder:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatchDocumentRequest'

    CreateReceipt:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - paymentType
              - receiptLines
            properties:
              uuid:
                type: [string, 'null']
                format: uuid
                description: |
                  Client-generated UUID of the Receipt. When a Receipt with this UUID already exists,
                  no new Receipt is created and the existing one is returned (safe retry for offline clients).
                example: '9961d718-cae7-48e9-845d-e5c21f4ecdb3'
              issuedAt:
                type: [string, 'null']
                format: date-time
                description: Time of the sale. Defaults to the time when the server records the Receipt.
                example: '2026-10-21T10:15:30.000Z'
              paymentType:
                type: string
                enum:
                  - Cash
                  - Card
                  - Qr
              warehouseId:
                type: string
                nullable: true
                description: Warehouse from which stock should be deducted (wh_ prefixed KSUID). When omitted, the cash register settings warehouse is used.
              receiptLines:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    amount:
                      type: number
                      format: float
                      description: Quantity of the item. Fractional values are accepted; stock is deducted using round(amount) as whole units.
                    unitPrice:
                      allOf:
                        - $ref: "#/components/schemas/Money"
                      description: Price of a single unit of the item.
                    taxRate:
                      type: [integer, 'null']
                      description: Tax rate applied on the item or null if VAT is not applicable.
                    productId:
                      type: string
                      description: Internal ID of the product associated with the receipt line.
                    skuId:
                      type: string
                      description: Internal ID of the SKU associated with the receipt line.
                    sale:
                      type: object
                      description: Optional sale applied to the receipt line. When present, the object MUST contain both `type` and `value`.
                      required:
                        - type
                        - value
                      properties:
                        type:
                          type: string
                          enum:
                            - none
                            - absolute
                            - percent
                          description: Type of sale applied to the line.
                        value:
                          type: integer
                          minimum: 1
                          description: Positive integer value of the sale. For `absolute` this is amount in smallest currency unit (e.g. cents), for `percent` this is percentage points (e.g. 10 means 10%).
                  required:
                    - amount
                    - unitPrice

  responses:
    ErrorResponse:
      description: General error response for all endpoints
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: There was an error authenticating a request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

webhooks:
  invoicePaid:
    post:
      summary: Invoice paid event payload
      operationId: "invoicePaidWebhook"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum:
                    - invoicePaid
                payload:
                  type: object
                  required:
                    - uuid
                    - symbol
                    - dateOfPayment
                  properties:
                    uuid:
                      type: string
                      format: uuid
                      description: UUID of the Invoice
                    symbol:
                      type: string
                      description: Symbol of the paid Invoice
                    orderUuid:
                      type: string
                      format: uuid
                      description: UUID of the related Order
                    orderSymbol:
                      type: [string, 'null']
                      description: Symbol of the associated Order
                    customSymbol:
                      type: [string, 'null']
                    dateOfPayment:
                      type: string
                      format: date-time
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Indicate that the data was received successfully

  invoiceUpdated:
    post:
      summary: Invoice updated event payload
      operationId: "invoiceUpdatedWebhook"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum:
                    - invoiceUpdated
                payload:
                  type: object
                  required:
                    - invoiceUuid
                    - symbol
                  properties:
                    invoiceUuid:
                      type: string
                      format: uuid
                      description: UUID of the Invoice
                    symbol:
                      type: string
                      description: Symbol of the paid Invoice
                    orderUuid:
                      type: string
                      format: uuid
                      description: UUID of the related Order
                    orderSymbol:
                      type: [string, 'null']
                      description: Symbol of the associated Order
                    customSymbol:
                      type: [string, 'null']
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/DocumentItem'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Indicate that the data was received successfully

  orderPaid:
    post:
      summary: Order paid event payload
      operationId: "orderPaidWebhook"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum:
                    - orderPaid
                payload:
                  type: object
                  required:
                    - uuid
                    - symbol
                    - dateOfPayment
                  properties:
                    uuid:
                      type: string
                      format: uuid
                      description: UUID of the paid Order
                    symbol:
                      type: string
                      description: Symbol of the paid Order
                    dateOfPayment:
                      type: string
                      format: date-time
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Indicate that the data was received successfully

security:
  - bearerAuth: []
