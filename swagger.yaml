        Returns a paginated list of SKUs, optionally filtered by product.
        When filtered by productId, returns the system SKU only if it is the sole SKU for that product;
        otherwise user-defined SKUs are returned and the system SKU is excluded.
        Without productId, the list contains all user-defined SKUs plus the system SKU of any product that has no user-defined SKU.
      operationId: listSkus
      parameters:
        - in: query
          name: productId
          schema:
            type: string
          required: false
          description: Filter SKUs by catalog product ID.
        - in: query
          name: includeSystem
          schema:
            type: boolean
            default: false
          required: false
          description: |
            When filtering by productId, include the hidden system SKU alongside user-defined SKUs.
            Defaults to false (system SKU is excluded when user-defined SKUs exist).
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/orderBy'
      responses:
        '200':
          description: OK
          content:
