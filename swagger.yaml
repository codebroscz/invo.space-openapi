openapi: "3.1.1"
info:
  description: |
    # Official documentation for the invo.space API.

    ## Glossary

    * Internal ID: identificator in invo.space
    * External ID: identificator in your or other system
    * Document: Expense, Invoice or Order.

    ## Common formats
    * UUID version 4
    * date-time is in ISO
    * errors follow https://datatracker.ietf.org/doc/html/rfc7807

  version: "2.0.0"
  title: "invo.space"
  contact:
    email: "bros@codebros.cz"

servers:
  - url: "https://invo.space/api/v2"
    description: "Production server"

paths:
  /auth/signup:
    post:
      summary: "Sign up"
      operationId: "signUp"
      description: |
        Creates a new user account. The user will receive an email with a link to set the password.
        The user will be logged in automatically after the account is created.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  description: Full name of the user
                  example: "John Doe"
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '204':
          description: User account successfully created

  /auth/verify:
    post:
      summary: "Resend verification e-mail"
      operationId: "resendVerification"
      description: |
        Resends the account verification e-mail for an unverified account.
        For unknown or already verified e-mails the endpoint responds with 204 without sending anything,
        to prevent account enumeration.

        Requests are throttled: after a verification e-mail is sent, another one can be requested
        after the cooldown indicated by the `Retry-After` header (in seconds). Within the cooldown
        the endpoint responds with 429 and error code 42902.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Verification e-mail sent (or silently ignored)
          headers:
            Retry-After:
              description: Seconds until the verification e-mail can be requested again
              schema:
                type: integer
                example: 120
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          description: Verification e-mail was requested too recently (error code 42902)
          headers:
            Retry-After:
              description: Seconds until the verification e-mail can be requested again
              schema:
                type: integer
                example: 87
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: "Confirm verification e-mail"
      operationId: "confirmVerification"
      description: |
        Confirms a user e-mail address with the token from the verification e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
      responses:
        '204':
          description: E-mail address verified
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /auth/token:
    servers:
      - url: "https://invo.space/api/v1"
        description: "Production server (API v1)"
    post:
      summary: "Get JWT token"
      operationId: "getAuthToken"
      description: |
        Returns a JWT token and a refresh token for the given credentials.
        The token is bound to the current account of the user (`acc` claim).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "user"
                password:
                  type: string
                  example: "pass"
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        '400':
          $ref: "#/components/responses/ErrorResponse"
        '401':
          $ref: "#/components/responses/ErrorResponse"
        '429':
          description: "Too many failed login attempts for this e-mail or from this IP address. Wait for `Retry-After` seconds."
          headers:
            Retry-After:
              schema:
                type: integer

  /auth/refresh:
    servers:
      - url: "https://invo.space/api/v1"
        description: "Production server (API v1)"
    post:
      summary: "Refresh JWT token"
      operationId: "refreshAuthToken"
      description: |
        Returns a new JWT token and a new refresh token. The used refresh token stops working, so the client must store the new one.
        Using an already used refresh token again ends the whole session (both the old and the new tokens),
        because it means the token was copied. Clients must not send two refresh requests with the same refresh token at the same time.
        The new token keeps the account of the refresh token, so an account switch on another device has no effect on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        '400':
          $ref: "#/components/responses/ErrorResponse"

  /auth/logout:
    post:
      summary: "Log out"
      operationId: "logout"
      description: |
        Ends one session: its access token and refresh token stop working at once.
        Other sessions of the user (other devices) do not change. Unknown refresh tokens are ignored.
        * Token clients (mobile app) send the refresh token in the body.
        * The web sends no body; the refresh token comes from the `refresh_token` cookie, which is then cleared.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: "Session ended"
        '400':
          $ref: "#/components/responses/ErrorResponse"

  /me:
    get:
      summary: "Get current user"
      operationId: "getMe"
      description: Returns the authenticated user and the account of this request.
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /me/account:
    post:
      summary: "Switch account"
      operationId: "switchAccount"
      description: |
        Switches the account.
        * Bearer token clients get new tokens in the body (200). Only these tokens use the new account; other devices and sessions do not change.
          The session of the token that made the request ends, so the client must replace both tokens.
        * Session (cookie) clients get the token in the `Authorization` header and the refresh token in a cookie (204). The account is saved on the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountId
              properties:
                accountId:
                  type: string
                  description: Account ID (acc_ prefixed KSUID).
      responses:
        '200':
          description: "Account switched (Bearer token client)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        '204':
          description: "Account switched (session client)"
        '400':
          $ref: "#/components/responses/ErrorResponse"
        '403':
          $ref: "#/components/responses/ErrorResponse"

  /contacts:
    #    $ref: "./paths/contacts.yaml"
    get:
      tags:
        - contacts
      summary: "List Contacts"
      operationId: "getContacts"
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: "A list of Contacts."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Participant"
                  total:
                    type: integer
                    description: Total number of Contacts
                    example: 93

    post:
      tags:
        - contacts
      summary: "Create new Contact"
      operationId: "createContact"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Participant'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Contact was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /contacts/{id}:
    get:
      tags:
        - contacts
      summary: Get single Contact
      operationId: "getContact"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Identification of the Contact. As of now it is symbol of the Contact.
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Contact with requested ID was found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always 'ok'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Internal ID of the Contact.
                        example: "37"

  /currencies:
    get:
      tags:
        - currencies
      summary: List available currencies
      description: Returns a list of available currencies in the app.
      operationId: "getCurrencies"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: "A list of Currencies."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Currency"
                  total:
                    type: integer
                    description: Total number of Currencies
                    example: 3

  /expenses:
    #    $ref: "./paths/expenses.yaml"
    get:
      tags:
        - expenses
      summary: "List Expenses"
      description: "Returns a list of Expenses for a given year and optionally for a given month."
      operationId: "getExpenses"
      parameters:
        - $ref: "#/components/parameters/year"
        - $ref: "#/components/parameters/month"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: "A list of Expenses."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Expense"
                  total:
                    type: integer
                    description: Total number of Expenses
                    example: 28

    post:
      tags:
        - expenses
      summary: "Create new Expense"
      #      description:
      operationId: "createExpense"
      requestBody:
        $ref: '#/components/requestBodies/CreateExpense'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Expense was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdentificationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /expenses/{id}:
    get:
      tags:
        - expenses
      summary: Get single Expense
      operationId: "getExpense"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Identification of the Expense. As of now it is symbol of the Expense.
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Expense with requested ID was found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Expense'
                  - type: object
                    properties:
                      permalink:
                        type: string
                        format: url
                        description: Permanent link leading to PDF version of the Expense.
                        example: "https://invo.space/permalink/expense/9961d718-cae7-48e9-845d-e5c21f4ecdb3"
        default:
          $ref: '#/components/responses/ErrorResponse'

  /invoices:
#    $ref: "./paths/invoices.yaml"
    get:
      tags:
        - invoices
      summary: "List Invoices"
      description: "Returns a list of Invoices for a given year and optionally for a given month."
      operationId: "getInvoices"
      parameters:
        - $ref: "#/components/parameters/year"
        - $ref: "#/components/parameters/month"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: "A list of Invoices."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
                  total:
                    type: integer
                    description: Total number of Invoices
                    example: 72

    post:
      tags:
        - invoices
      summary: "Create new Invoice"
#      description:
      operationId: "createInvoice"
      requestBody:
        $ref: '#/components/requestBodies/CreateInvoice'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Invoice was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdentificationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /invoices/{id}:
    get:
      tags:
        - invoices
      summary: Get single Invoice
      operationId: "getInvoice"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Identification of the Invoice. As of now it is symbol of the Invoice.
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Invoice with requested ID was found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invoice'
                  - type: object
                    properties:
                      permalink:
                        type: string
                        format: url
                        description: Permanent link leading to PDF version of the Invoice.
                        example: "https://invo.space/permalink/invoice/9961d718-cae7-48e9-845d-e5c21f4ecdb3"
        default:
          $ref: '#/components/responses/ErrorResponse'

    patch:
      tags:
        - invoices
      summary: Partially update Invoice
      operationId: "patchInvoice"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identification of the Invoice is possible only via its UUID.
            example: '9961d718-cae7-48e9-845d-e5c21f4ecdb3'
      requestBody:
        $ref: '#/components/requestBodies/PatchInvoice'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Invoice was updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchDocumentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

    put:
      tags:
        - invoices
      summary: Update Invoice
      operationId: "updateInvoice"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identification of the Invoice is possible only via its UUID.
            example: '9961d718-cae7-48e9-845d-e5c21f4ecdb3'
      requestBody:
        $ref: '#/components/requestBodies/CreateInvoice'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Invoice was updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdentificationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      tags:
        - invoices
      summary: Delete Invoice
      operationId: "deleteInvoice"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identification of the Invoice is possible only via its UUID.
            example: '9961d718-cae7-48e9-845d-e5c21f4ecdb3'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '204':
          description: Invoice was deleted successfully
        default:
          $ref: '#/components/responses/ErrorResponse'

  /orders:
    #    $ref: "./paths/orders.yaml"
    get:
      tags:
        - orders
      summary: "List Orders"
      description: "Returns a list of Orders for a given year and optionally for a given month."
      operationId: "getOrders"
      parameters:
        - $ref: "#/components/parameters/year"
        - $ref: "#/components/parameters/month"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: "A list of Orders."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total:
                    type: integer
                    description: Total number of Orders
                    example: 12

    post:
      tags:
        - orders
      summary: "Create new Order"
      operationId: "createOrder"
      requestBody:
        $ref: '#/components/requestBodies/CreateOrder'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Order was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdentificationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /orders/{id}:
    get:
      tags:
        - orders
      summary: Get single Order
      operationId: "getOrder"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Identification of the Order. As of now it is symbol of the Order.
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Order with requested ID was found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    properties:
                      permalink:
                        type: string
                        format: url
                        description: Permanent link leading to PDF version of the Order.
                        example: "https://invo.space/permalink/order/9961d718-cae7-48e9-845d-e5c21f4ecdb3"
        default:
          $ref: '#/components/responses/ErrorResponse'

  /document-sequences:
    get:
      tags:
        - document-sequences
      summary: List Document sequences of given type
      description: Returns a list of Document sequences of requested type for the authenticated user.
      operationId: "getDocumentSequences"
      parameters:
        -
          name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - invoice
              - order
              - expense

      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: "A list of Document sequences."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentSequence"
                  total:
                    type: integer
                    description: Total number of Document sequences
                    example: 1
    post:
      tags:
        - document-sequences
      summary: Create new Document sequence
      description: Returns a list of Document sequences for the authenticated user.
      operationId: "createDocumentSequence"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: "Returns new Document sequence. Setting it as default will replace the current default."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSequence"

  /document-sequences/{id}:
    get:
      tags:
        - document-sequences
      summary: Get single Document sequence
      description: Returns a Document sequence with requested ID.
      operationId: "getDocumentSequence"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Identification of the Document sequence.
      responses:
        '200':
          description: Document sequence with requested ID was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSequence"
        '404':
          $ref: "#/components/responses/ErrorResponse"

    post:
      tags:
        - document-sequences
      summary: Update Document sequence
      description: Updates a Document sequence with requested ID. Setting it as default will replace the current default.
      operationId: "updateDocumentSequence"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Identification of the Document sequence.
      responses:
        '200':
          description: Document sequence with requested ID was found and updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSequence"
        '404':
          $ref: "#/components/responses/ErrorResponse"

  /cash-register/settings:
    servers:
      - url: "https://invo.space/api/v1"
        description: "Production server (API v1)"
    get:
      tags:
        - cash-register
      summary: Get cash register settings
      description: Returns cash register settings for the authenticated user.
      operationId: "getCashRegisterSettings"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Cash register settings were retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [cashRegisterIdentifier, address, workplaceIdentifier, amountThenPrice, showEmail, showPhone, taxRates, defaultTaxRate, paymentTypes, warehouseId]
                properties:
                  cashRegisterIdentifier:
                    type: string
                    description: Unique identifier or name of the cash register.
                    example: "My Cash Register 1"
                  address:
                    anyOf:
                      - $ref: '#/components/schemas/Address'
                      - type: 'null'
                  workplaceIdentifier:
                    type: string
                    description: Unique identifier of the workplace ("IČ provozovny").
                  amountThenPrice:
                    type: boolean
                    description: Specifies whether the amount is first typed and then the price or vice versa.
                  showEmail:
                    type: boolean
                    description: Whether to print email on the receipt.
                  showPhone:
                    type: boolean
                    description: Whether to print phone number on the receipt.
                  taxRates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxRate'
                    description: List of enabled tax rates.
                  defaultTaxRate:
                    description: Default tax rate. Must be one of the enabled tax rates.
                    anyOf:
                      - $ref: '#/components/schemas/TaxRate'
                      - type: 'null'
                  paymentTypes:
                    type: array
                    items:
                      type: string
                      enum:
                        - Card
                        - Cash
                        - Qr
                    minItems: 1
                    description: List of enabled payment types for the cash register. At least one must be provided.
                  warehouseId:
                    type: [string, 'null']
                    description: Warehouse used for stock deduction and returns from this cash register (wh_ prefixed KSUID).

        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      tags:
        - cash-register
      summary: Create new cash register settings
      description: Creates cash register settings for the account. New settings record is created while previous settings are kept for audit purposes.
      operationId: "createCashRegisterSettings"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cashRegisterIdentifier:
                  type: string
                  description: Unique identifier or name of the cash register.
                  example: "My Cash Register 1"
                amountThenPrice:
                  type: boolean
                  description: Specifies whether the amount is first typed and then the price or vice versa.
                address:
                  $ref: '#/components/schemas/Address'
                workplaceId:
                  type: string
                  description: Unique identifier of the workplace ("IČ provozovny").
                taxRates:
                  type: array
                  items:
                    type: string
                  description: List of IDs of enabled tax rates. Not every seller sells goods in all tax rates, this can help to simplify GUI of the cash register and therefore UX.
                  example:
                    - "1"
                    - "3"
                defaultTaxRate:
                  type: string
                  description: Default tax rate that is selected in cash register. Must be one of the enabled tax rates.
                  example: '3'
                showEmail:
                  type: boolean
                  description: Whether to print email on the receipt.
                showPhone:
                  type: boolean
                  description: Whether to print phone number on the receipt.
                paymentTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - Card
                      - Cash
                      - Qr
                  minItems: 1
                  description: List of enabled payment types for the cash register. At least one must be provided.
                warehouseId:
                  type: [string, 'null']
                  description: Warehouse used for stock deduction and returns from this cash register (wh_ prefixed KSUID).
              required:
                - cashRegisterIdentifier
                - amountThenPrice
                - address
                - workplaceId
                - taxRates
                - defaultTaxRate
                - paymentTypes
                - showEmail
                - showPhone
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
