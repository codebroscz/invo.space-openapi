          type: string
        isActive:
          type: boolean
        isDefault:
          type: boolean

    StockItem:
      type: object
      properties:
        id:
          type: string
          description: KSUID with si_ prefix.
          example: si_2udYHpoPWQeAazs1GOWA7BEZxUc
        skuId:
          type: string
          description: Reference to SKU ID (sku_ prefixed KSUID).
        skuCode:
          type: [string, 'null']
          description: SKU code (read-only, enriched).
        skuName:
          type: [string, 'null']
          description: SKU name (read-only, enriched).
        warehouseId:
          type: string
          description: Reference to Warehouse ID (wh_ prefixed KSUID).
        warehouseName:
          type: string
          description: Warehouse name (read-only, enriched).
        warehouseCode:
          type: string
          description: Warehouse code (read-only, enriched).
        quantityOnHand:
          type: integer
          description: Physical stock count.
        quantityReserved:
          type: integer
          description: Quantity reserved for pending orders.
        quantityAvailable:
          type: integer
          description: "Computed: quantityOnHand - quantityReserved."
        trackingMode:
          type: string
          enum: [tracked, unlimited]
          description: Stock tracking mode. Unlimited items never block sales; adding stock switches to tracked.
        isUnlimited:
          type: boolean
          description: Whether stock availability is treated as infinite.
        batchNumber:
          type: [string, 'null']
        binLocation:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - skuId
        - warehouseId
        - quantityOnHand
        - quantityReserved
        - quantityAvailable
        - trackingMode
        - isUnlimited

    StockItemPatch:
      type: object
      properties:
        binLocation:
          type: [string, 'null']
          description: Storage bin location, or null to clear.

    StockMove:
      type: object
      properties:
        id:
          type: string
          description: KSUID with sm_ prefix.
          example: sm_2udYHpoPWQeAazs1GOWA7BEZxUc
        stockItemId:
          type: string
          description: Reference to StockItem ID (si_ prefixed KSUID).
        type:
          type: string
          enum: [receipt, issue, adjustment, transfer_in, transfer_out]
        quantityDelta:
          type: integer
          description: Signed quantity change applied by this move.
        quantityAfter:
          type: integer
          description: Quantity on hand after this move.
        reason:
          type: [string, 'null']
          description: "Move reason. System values include `opening_balance`, `sale` (POS issue), and `sale_return` (stock restored on receipt soft-delete/refund)."
        note:
          type: [string, 'null']
        reference:
          type: [string, 'null']
          description: Optional external document reference.
        transferId:
          type: [string, 'null']
          description: Shared identifier for linked transfer moves.
        createdAt:
          type: string
          format: date-time
        skuId:
          type: string
        skuCode:
          type: [string, 'null']
        skuName:
          type: [string, 'null']
        warehouseId:
          type: string
        warehouseName:
          type: string
        warehouseCode:
          type: string
        batchNumber:
          type: [string, 'null']
      required:
        - id
        - stockItemId
        - type
        - quantityDelta
        - quantityAfter
        - skuId
        - warehouseId

    StockMoveCreate:
      type: object
      properties:
        warehouseId:
          type: string
          description: Warehouse ID (wh_ prefixed KSUID).
        batchNumber:
          type: [string, 'null']
        type:
          type: string
          enum: [receipt, issue, adjustment]
          description: Move type. Receipt and issue use positive quantity; adjustment uses signed quantity.
        quantity:
          type: integer
          description: Quantity for receipt/issue (positive) or signed delta for adjustment.
        reason:
          type: [string, 'null']
        note:
          type: [string, 'null']
        reference:
          type: [string, 'null']
      required:
        - warehouseId
        - type
        - quantity

    StockTransferCreate:
      type: object
      properties:
        skuId:
          type: string
          description: SKU ID (sku_ prefixed KSUID).
        fromWarehouseId:
          type: string
          description: Source warehouse ID (wh_ prefixed KSUID).
        toWarehouseId:
          type: string
          description: Destination warehouse ID (wh_ prefixed KSUID).
        quantity:
          type: integer
          description: Quantity to transfer (positive).
        batchNumber:
          type: [string, 'null']
        note:
          type: [string, 'null']
      required:
        - skuId
        - fromWarehouseId
        - toWarehouseId
        - quantity

    StockItemCreate:
      type: object
      properties:
        skuId:
          type: string
          description: SKU ID (sku_ prefixed KSUID).
        warehouseId:
          type: string
          description: Warehouse ID (wh_ prefixed KSUID).
        batchNumber:
          type: [string, 'null']
        binLocation:
          type: [string, 'null']
        quantityOnHand:
          type: integer
          default: 0
      required:
        - skuId
        - warehouseId

    TaxRate:
      type: object
      properties:
        id:
          type: string
          description: ID of the tax rate. Currently numeric string, but will be in `tax_<string>` KSUID format in the future.
          example: '3'
        name:
          type: string
          description: Name of the tax rate
          example: Standard VAT
        percentage:
          type: number
          description: Percentage value of the tax rate
          example: 21
        default:
          type: string
          enum:
            - 'yes'
            - 'no'
          description: Whether the tax rate is default within the country
        validSince:
          type: string
          format: date
          description: Date since when the tax rate is valid
          example: 2024-01-01
        validUntil:
          type: [string, 'null']
          format: date
          description: Date until when the tax rate is valid
          example: 2024-12-31
      required:
        - id
        - name
        - percentage
        - default
        - validSince
        - validUntil
#        replacedBy:
#          type: object
#          nullable: true
#          description: Tax rate that replaced this tax rate
#          $ref: '#/components/schemas/TaxRate'

    InvoicingBankAccount:
      type: object
      properties:
        id:
          type: string
          description: KSUID of the invoicing bank account (iba_ prefix)
          example: iba_2NnBKHDxMPBGdFrMjiDkPztLqCJ
        name:
          type: string
          description: User-friendly label for the bank account
