      operationId: "listRaiffeisenBankAccounts"
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      availableAccounts:
                        type: array
                        description: Accounts available in the Raiffeisen API.
                        items:
                          $ref: '#/components/schemas/RaiffeisenAvailableAccount'
                      knownAccounts:
                        type: array
                        description: Account numbers already tracked in the system.
                        items:
                          type: string
                          example: '1234567890'
        '204':
          description: No credentials configured
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

