    Sku:
      type: object
      properties:
        id:
          type: string
          description: KSUID with sku_ prefix.
          example: sku_2udYHpoPWQeAazs1GOWA7BEZxUc
        code:
          type: string
          description: Unique SKU code (the sellable unit identifier).
        name:
          type: string
          description: Display name of the SKU variant.
        slug:
          type: string
          description: URL-friendly slug derived from the SKU name.
        productId:
          type: string
          description: Reference to the catalog Product ID (pr_ prefixed KSUID).
        isBundle:
          type: boolean
          description: Whether this SKU is a bundle of other SKUs.
        isActive:
          type: boolean
        isSystem:
          type: boolean
          description: True for the auto-created hidden SKU. Omitted from product SKU lists when user-defined SKUs exist.
        optionValueIds:
          type: array
          description: Variant value IDs that define this SKU option combination.
          items:
            type: string
        options:
          type: array
          description: Optional resolved option labels for the SKU combination.
          items:
            type: object
            properties:
              axisId:
                type: string
              valueId:
                type: string
              label:
                type: string
        optionComboHash:
          type: [string, 'null']
          description: Stable hash of the sorted option value IDs. Null for SKUs without options.
        price:
          $ref: '#/components/schemas/SkuPrice'
          description: Current active price, null if no price is set.
        bundleItems:
          type: array
          description: Present only when isBundle is true.
          items:
            $ref: '#/components/schemas/BundleItem'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - code
        - productId
        - isBundle
        - isActive
        - isSystem

    SkuCreate:
      type: object
      properties:
        name:
          type: string
          description: Display name of the SKU variant.
        code:
          type: string
          description: Unique SKU code. Defaults to {productSlug}-{skuSlug} when omitted.
        productId:
          type: string
          description: Catalog Product ID (pr_ prefixed KSUID).
        isBundle:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        optionValueIds:
          type: array
          description: Variant value IDs that define this SKU option combination.
          items:
            type: string
        bundleItems:
          type: [array, 'null']
          description: Required when isBundle is true.
          items:
            $ref: '#/components/schemas/BundleItem'
      required:
        - name
        - productId

    SkuPatch:
      type: object
      properties:
        name:
          type: string
          description: Display name of the SKU variant.
        code:
          type: string
        isActive:
          type: boolean
        bundleItems:
          type: [array, 'null']
          description: Replaces all bundle items. Only applicable to bundle SKUs.
          items:
            $ref: '#/components/schemas/BundleItem'

