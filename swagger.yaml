        - raiffeisen-bank
      summary: Get Raiffeisen Bank integration status
      description: Returns connection status, available accounts from Raiffeisen API, and already tracked (known) accounts.
      operationId: "getRaiffeisenBankStatus"
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Integration status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      credentials:
                        type: boolean
                        description: Whether API credentials are configured.
                      connection:
                        type: string
                        enum:
                          - success
                          - failed
                          - n/a
                        description: Result of the connection test. `n/a` when no credentials are configured.
                      availableAccounts:
                        type: array
                        description: Accounts available in the Raiffeisen API. Empty if credentials are missing or connection failed.
                        items:
                          $ref: '#/components/schemas/RaiffeisenAvailableAccount'
                      knownAccounts:
                        type: array
                        description: Account numbers already tracked in the system.
                        items:
                          type: string
                          example: '1234567890'

    post:
      tags:
        - raiffeisen-bank
      summary: Create Raiffeisen Bank credentials
      description: Saves API credentials (certificate + password) for the Raiffeisen Bank integration. The certificate is validated before saving.
      operationId: "createRaiffeisenBankCredentials"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - certificate
                - password
              properties:
                certificate:
                  type: string
                  description: Base64-encoded .p12 certificate.
                password:
                  type: string
                  description: Password for the certificate.
      responses:
        '204':
          description: Credentials saved successfully
        '400':
          $ref: '#/components/responses/ErrorResponse'

